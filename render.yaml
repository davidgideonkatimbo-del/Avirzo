services:
  - type: web
    name: avirzo
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AVIRZO_PUBLIC_URL
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CREATOR_PRICE_ID
        sync: false
      - key: STRIPE_STUDIO_PRICE_ID
        sync: false

  - type: worker
    name: avirzo-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node server/src/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        fromService:
          name: avirzo
          type: web
          envVarKey: VITE_SUPABASE_URL
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        fromService:
          name: avirzo
          type: web
          envVarKey: VITE_SUPABASE_PUBLISHABLE_KEY
      - key: AVIRZO_PUBLIC_URL
        sync: false
      - key: WORKER_MAX_ATTEMPTS
        value: 3
      - key: WORKER_POLL_MS
        value: 5000
